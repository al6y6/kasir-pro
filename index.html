<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Kasir Pro — POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1156C4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --blue-900:#0B3D8C; --blue-700:#1156C4; --blue-500:#3B7DE8; --blue-100:#E8F0FE;
  --red-700:#C4291B; --red-600:#E0341F; --red-100:#FDE9E7;
  --ink-900:#12151C; --ink-700:#414A5A; --ink-500:#6B7280; --ink-300:#B8BFC9; --ink-100:#EDEFF3;
  --surface:#F6F7FA; --surface-hi:#FFFFFF; --line:#E4E7EC;
  --green:#1E8E5A; --amber:#B7791F;
  --radius-l:20px; --radius-m:14px; --radius-s:10px;
  --shadow-1:0 1px 2px rgba(18,21,28,.06),0 1px 8px rgba(18,21,28,.05);
  --shadow-2:0 8px 24px rgba(11,61,140,.14);
  --font-display:'Plus Jakarta Sans',sans-serif;
  --font-body:'Inter',sans-serif;
}
[data-theme="dark"]{
  --surface:#0F1218; --surface-hi:#1A1E27; --line:#2A2F3B;
  --ink-900:#F2F4F8; --ink-700:#C7CCD6; --ink-500:#8B93A3; --ink-300:#454C5A; --ink-100:#232834;
  --blue-100:#152A52; --red-100:#3A1712;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%; overscroll-behavior:none;}
body{
  font-family:var(--font-body); background:var(--surface); color:var(--ink-900);
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
.msr{font-family:'Material Symbols Rounded'; font-size:24px; line-height:1; vertical-align:middle; user-select:none;}
h1,h2,h3,.font-display{font-family:var(--font-display);}
button{font-family:inherit; cursor:pointer;}
.tabular{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--ink-300); border-radius:10px;}

/* ===================== APP BAR ===================== */
.appbar{
  background:linear-gradient(135deg,var(--blue-700),var(--blue-900));
  color:#fff; padding:14px 14px 16px; display:flex; align-items:center; gap:10px;
  flex-shrink:0; position:relative; z-index:20;
}
.appbar button{background:rgba(255,255,255,.14); border:none; color:#fff; width:40px; height:40px;
  border-radius:12px; display:flex; align-items:center; justify-content:center; transition:.15s;}
.appbar button:active{background:rgba(255,255,255,.3); transform:scale(.94);}
.appbar .title{font-family:var(--font-display); font-weight:700; font-size:18px; flex:1; letter-spacing:-.2px;}
.appbar .title small{display:block; font-family:var(--font-body); font-weight:400; font-size:11.5px; opacity:.75; margin-top:1px;}
.searchbar{display:none; align-items:center; gap:8px; background:rgba(255,255,255,.16); border-radius:14px; padding:0 12px; flex:1; height:40px;}
.searchbar.active{display:flex;}
.searchbar input{background:none; border:none; outline:none; color:#fff; flex:1; font-size:14.5px;}
.searchbar input::placeholder{color:rgba(255,255,255,.65);}

/* ===================== DRAWER ===================== */
.scrim{position:fixed; inset:0; background:rgba(10,14,22,.5); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
.scrim.open{opacity:1; pointer-events:auto;}
.drawer{position:fixed; top:0; left:0; bottom:0; width:290px; background:var(--surface-hi); z-index:50;
  transform:translateX(-100%); transition:transform .25s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; box-shadow:var(--shadow-2);}
.drawer.open{transform:translateX(0);}
.drawer-head{background:linear-gradient(135deg,var(--blue-700),var(--blue-900)); color:#fff; padding:28px 20px 20px;}
.drawer-head .brand{font-family:var(--font-display); font-weight:800; font-size:21px; display:flex; align-items:center; gap:8px;}
.drawer-head .sub{font-size:12.5px; opacity:.8; margin-top:4px;}
.drawer-sync{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; margin-top:12px; background:rgba(255,255,255,.15); padding:5px 10px; border-radius:20px;}
.dot{width:7px; height:7px; border-radius:50%; background:#8CE99A;}
.dot.yellow{background:#FFD43B;} .dot.red{background:#FF8787;}
.drawer nav{flex:1; overflow-y:auto; padding:10px 12px;}
.nav-item{display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px; color:var(--ink-700);
  font-size:14.5px; font-weight:600; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;}
.nav-item .msr{color:var(--ink-500);}
.nav-item.active{background:var(--blue-100); color:var(--blue-700);}
.nav-item.active .msr{color:var(--blue-700);}
.nav-item:active{background:var(--ink-100);}
.nav-sep{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-500); font-weight:700; padding:14px 14px 6px;}
.drawer-foot{padding:14px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
.theme-toggle{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-700); font-weight:600;}
.switch{width:42px; height:24px; background:var(--ink-300); border-radius:20px; position:relative; border:none; padding:0;}
.switch::after{content:''; position:absolute; width:18px; height:18px; background:#fff; border-radius:50%; top:3px; left:3px; transition:.2s;}
.switch.on{background:var(--blue-700);}
.switch.on::after{transform:translateX(18px);}

/* ===================== LAYOUT ===================== */
.page{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:24px;}
.hide{display:none !important;}

/* connection gate */
.gate{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; padding:36px 28px;}
.gate .msr{font-size:56px; color:var(--blue-500); background:var(--blue-100); width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:20px;}
.gate h2{margin:0 0 8px; font-size:19px;}
.gate p{color:var(--ink-500); font-size:14px; line-height:1.5; margin:0 0 22px; max-width:320px;}
.btn{border:none; border-radius:14px; padding:13px 20px; font-weight:700; font-size:14.5px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue-700); color:#fff; box-shadow:0 6px 16px rgba(17,86,196,.28);}
.btn-outline{background:none; border:1.5px solid var(--line); color:var(--ink-700);}
.btn-danger{background:var(--red-600); color:#fff;}
.btn-ghost{background:var(--ink-100); color:var(--ink-700);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:10px;}
.stack{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px;}

/* product grid / transaksi page */
.chips{display:flex; gap:8px; overflow-x:auto; padding:12px 14px 4px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; padding:8px 16px; border-radius:20px; background:var(--surface-hi); border:1.5px solid var(--line); font-size:13px; font-weight:600; color:var(--ink-700);}
.chip.active{background:var(--blue-700); border-color:var(--blue-700); color:#fff;}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:10px 14px 100px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
.pcard{background:var(--surface-hi); border-radius:var(--radius-m); overflow:hidden; box-shadow:var(--shadow-1); position:relative; display:flex; flex-direction:column; border:1px solid var(--line);}
.pcard .img{aspect-ratio:1.25/1; background:var(--ink-100); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
.pcard .img img{width:100%; height:100%; object-fit:cover;}
.pcard .img .msr{font-size:32px; color:var(--ink-300);}
.badge{position:absolute; top:8px; left:8px; background:rgba(11,61,140,.85); color:#fff; font-size:10px; font-weight:700; padding:3px 8px; border-radius:8px;}
.badge-low{position:absolute; bottom:8px; right:8px; background:var(--red-600); color:#fff; font-size:10px; font-weight:700; padding:3px 7px; border-radius:8px;}
.pcard .body{padding:10px 11px 11px;}
.pcard .name{font-size:13px; font-weight:600; line-height:1.25; height:33px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.pcard .price{font-family:var(--font-display); font-weight:800; color:var(--blue-700); font-size:15px; margin-top:5px;}
.pcard .stok{font-size:11px; color:var(--ink-500); margin-top:1px;}
.addbtn{position:absolute; bottom:11px; right:11px; width:32px; height:32px; border-radius:10px; background:var(--blue-700); color:#fff; border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(17,86,196,.35);}
.qtybox{position:absolute; bottom:9px; right:9px; left:9px; background:var(--blue-700); border-radius:11px; display:flex; align-items:center; justify-content:space-between; padding:4px 6px; box-shadow:0 4px 10px rgba(17,86,196,.35);}
.qtybox button{width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,.2); color:#fff; border:none; display:flex; align-items:center; justify-content:center;}
.qtybox button:active{background:rgba(255,255,255,.4);}
.qtybox .qn{color:#fff; font-weight:700; font-size:14px; min-width:20px; text-align:center;}
.qtybox .msr{font-size:17px;}
/* list (horizontal) view mode for products */
.grid.list-view{display:flex; flex-direction:column; grid-template-columns:none; gap:10px;}
.grid.list-view .pcard{flex-direction:row; align-items:stretch;}
.grid.list-view .pcard .img{aspect-ratio:auto; width:92px; height:92px; flex-shrink:0;}
.grid.list-view .pcard .body{flex:1; padding:10px 12px; display:flex; flex-direction:column; justify-content:center;}
.grid.list-view .pcard .name{height:auto; -webkit-line-clamp:1;}
.grid.list-view .addbtn{position:static; margin:auto 10px auto 0; align-self:center;}
.grid.list-view .qtybox{position:static; margin:auto 8px auto 0; align-self:center; width:auto; left:auto; right:auto; bottom:auto;}
.grid.list-view .badge,.grid.list-view .badge-low{font-size:9px; padding:2px 6px;}
.skeleton{background:linear-gradient(90deg,var(--ink-100) 25%,var(--line) 37%,var(--ink-100) 63%); background-size:400% 100%; animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 24px; text-align:center; color:var(--ink-500);}
.empty .msr{font-size:44px; color:var(--ink-300); margin-bottom:10px;}

/* bottom cart */
.bottomcart{position:fixed; left:14px; right:14px; bottom:14px; background:linear-gradient(120deg,var(--red-600),var(--red-700));
  border-radius:18px; padding:13px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 10px 26px rgba(196,41,27,.4); z-index:30; color:#fff; transition:transform .2s;}
.bottomcart.hidden{transform:translateY(140%);}
.bottomcart .icon-wrap{position:relative;}
.bottomcart .count{position:absolute; top:-8px; right:-8px; background:#fff; color:var(--red-700); font-size:10.5px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;}
.bottomcart .info{flex:1; line-height:1.2;}
.bottomcart .info .l1{font-size:11.5px; opacity:.85;}
.bottomcart .info .l2{font-family:var(--font-display); font-weight:800; font-size:16.5px;}
.bottomcart .go{background:#fff; color:var(--red-700); border:none; padding:10px 18px; border-radius:12px; font-weight:800; font-size:13.5px; display:flex; align-items:center; gap:6px;}

/* sheets / modals */
.sheet-scrim{position:fixed; inset:0; background:rgba(10,14,22,.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;}
.sheet-scrim.open{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--surface-hi); z-index:61; border-radius:22px 22px 0 0;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.85,.25,1); max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-2);}
.sheet.open{transform:translateY(0);}
.sheet .handle{width:38px; height:4px; background:var(--ink-300); border-radius:4px; margin:10px auto 4px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:10px 18px 12px; border-bottom:1px solid var(--line);}
.sheet-head h3{margin:0; font-size:16.5px;}
.sheet-body{overflow-y:auto; padding:16px 18px 22px;}
.iconbtn{width:34px; height:34px; border-radius:10px; background:var(--ink-100); border:none; display:flex; align-items:center; justify-content:center; color:var(--ink-700);}

.cartline{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.cartline .thumb{width:46px; height:46px; border-radius:10px; background:var(--ink-100); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ink-300); overflow:hidden;}
.cartline .thumb img{width:100%; height:100%; object-fit:cover;}
.cartline .meta{flex:1; min-width:0;}
.cartline .meta .n{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cartline .meta .p{font-size:12px; color:var(--ink-500);}
.qtystep{display:flex; align-items:center; gap:8px;}
.qtystep button{width:26px; height:26px; border-radius:8px; background:var(--ink-100); border:none; display:flex; align-items:center; justify-content:center;}
.qtystep span{min-width:18px; text-align:center; font-weight:700; font-size:13px;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-700); margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%; border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 13px; font-size:14px; color:var(--ink-900); outline:none; font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue-500);}
.field textarea{resize:vertical; min-height:70px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.sumrow{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--ink-700);}
.sumrow.total{font-family:var(--font-display); font-weight:800; font-size:17px; color:var(--ink-900); border-top:1px dashed var(--line); margin-top:6px; padding-top:12px;}
.paymethods{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0 16px;}
.pmethod{border:1.5px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; font-size:11.5px; font-weight:700; color:var(--ink-700); background:var(--surface);}
.pmethod.active{border-color:var(--blue-700); background:var(--blue-100); color:var(--blue-700);}
.pmethod .msr{display:block; margin:0 auto 4px;}

/* dashboard */
.section-title{font-family:var(--font-display); font-weight:700; font-size:15px; padding:18px 16px 8px; color:var(--ink-900);}
.kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px;}
.kpi{background:var(--surface-hi); border-radius:16px; padding:14px; box-shadow:var(--shadow-1); border:1px solid var(--line);}
.kpi .msr{color:var(--blue-700); background:var(--blue-100); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:8px;}
.kpi .val{font-family:var(--font-display); font-weight:800; font-size:19px;}
.kpi .lbl{font-size:11.5px; color:var(--ink-500); margin-top:2px;}
.card{background:var(--surface-hi); border-radius:16px; padding:14px; box-shadow:var(--shadow-1); margin:8px 14px; border:1px solid var(--line);}
.card h4{margin:0 0 10px; font-size:13.5px; font-weight:700;}
.listrow{display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px; border-bottom:1px solid var(--line);}
.listrow:last-child{border:none;}
.listrow .rank{width:20px; height:20px; border-radius:6px; background:var(--blue-100); color:var(--blue-700); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-right:8px;}
.chartwrap{height:180px; position:relative;}

/* lists (produk, kategori, riwayat) */
.listcard{background:var(--surface-hi); margin:0 14px 10px; border-radius:14px; padding:12px; box-shadow:var(--shadow-1); display:flex; gap:12px; align-items:center; border:1px solid var(--line);}
.listcard .thumb{width:52px; height:52px; border-radius:12px; background:var(--ink-100); display:flex; align-items:center; justify-content:center; color:var(--ink-300); overflow:hidden; flex-shrink:0;}
.listcard .thumb img{width:100%;height:100%;object-fit:cover;}
.listcard .info{flex:1; min-width:0;}
.listcard .info .t1{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.listcard .info .t2{font-size:12px; color:var(--ink-500); margin-top:2px;}
.listcard .actions{display:flex; gap:6px;}
.dotcat{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}

.fab{position:fixed; right:16px; bottom:16px; width:56px; height:56px; border-radius:18px; background:var(--blue-700); color:#fff; border:none; box-shadow:var(--shadow-2); display:flex; align-items:center; justify-content:center; z-index:25;}
.fab:active{transform:scale(.94);}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink-900); color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:100; opacity:0; pointer-events:none; transition:.25s; box-shadow:var(--shadow-2); display:flex; align-items:center; gap:8px;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.subtabs{display:flex; gap:6px; padding:12px 14px 4px; overflow-x:auto;}
.subtab{padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--ink-500); background:var(--ink-100); border:none; white-space:nowrap;}
.subtab.active{background:var(--blue-700); color:#fff;}

.spreadcard{background:var(--surface-hi); border-radius:16px; padding:14px; margin:0 14px 10px; box-shadow:var(--shadow-1); border:1.5px solid var(--line); position:relative;}
.spreadcard.active{border-color:var(--blue-700);}
.spreadcard .top{display:flex; justify-content:space-between; align-items:flex-start;}
.spreadcard .nm{font-weight:700; font-size:14.5px;}
.spreadcard .url{font-size:11.5px; color:var(--ink-500); margin-top:2px; word-break:break-all;}
.tag-active{background:var(--green); color:#fff; font-size:10px; font-weight:800; padding:3px 8px; border-radius:8px;}

/* favorit star */
.favstar{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:8px; background:rgba(0,0,0,.32); border:none; display:flex; align-items:center; justify-content:center; z-index:2;}
.favstar .msr{font-size:16px; color:#fff;}
.favstar.active .msr{color:#FFD43B; font-variation-settings:'FILL' 1;}
.list-view .favstar{top:6px; right:6px;}
.badge-terlaris{position:absolute; bottom:8px; left:8px; background:var(--amber); color:#fff; font-size:9.5px; font-weight:800; padding:3px 7px; border-radius:8px; display:flex; align-items:center; gap:2px;}
.list-view .badge-terlaris{bottom:auto; top:34px; left:8px;}

/* low stock banner */
.lowstock-banner{margin:10px 14px 0; background:var(--red-100); border:1px solid var(--red-600); border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--red-700); font-weight:600;}
.lowstock-banner .msr{color:var(--red-600);}
.lowstock-banner button{margin-left:auto; background:none; border:none; color:var(--red-700);}

/* login gate */
.login-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:30px 26px;}
.login-wrap .logo{width:74px; height:74px; border-radius:20px; background:linear-gradient(135deg,var(--blue-700),var(--blue-900)); display:flex; align-items:center; justify-content:center; margin-bottom:18px; box-shadow:var(--shadow-2);}
.login-wrap .logo .msr{font-size:36px; color:#fff;}
.login-wrap h2{margin:0 0 4px;}
.login-wrap p{color:var(--ink-500); font-size:13px; margin:0 0 22px;}

/* scanner */
.scanner-modal{position:fixed; inset:0; background:#000; z-index:80; display:flex; flex-direction:column;}
.scanner-modal video{flex:1; object-fit:cover; width:100%;}
.scanner-modal .scan-frame{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:70%; max-width:280px; aspect-ratio:1.6/1; border:3px solid var(--blue-500); border-radius:14px; box-shadow:0 0 0 2000px rgba(0,0,0,.45);}
.scanner-modal .scan-top{position:absolute; top:0; left:0; right:0; padding:16px; display:flex; justify-content:space-between; align-items:center; z-index:2;}

function activeSpreadsheet(){ return state.spreadsheets.find(function(s){return s.active;}); }
function apiUrl(){ var s = activeSpreadsheet(); return s ? s.url : null; }

/* =====================================================================
   API LAYER  (GET untuk query, POST text/plain berisi JSON utk mutasi
   — menghindari CORS preflight pada Apps Script)
===================================================================== */
function apiCall(action, params, method){
  // CATATAN: Semua panggilan (termasuk yang mengubah data) sengaja memakai
  // metode GET dengan parameter di query string. Apps Script Web App
  // me-redirect setiap request ke domain googleusercontent.com — pada
  // request POST, redirect 302 tsb membuat browser mengubahnya menjadi GET
  // dan MEMBUANG body POST, sehingga action & data ikut hilang. Dengan GET,
  // seluruh data ada di URL sehingga selamat melewati redirect.
  var base = apiUrl();
  if(!base){ return Promise.reject(new Error('Spreadsheet belum terhubung')); }
  params = params || {};
  var ss = activeSpreadsheet();
  params.spreadsheetId = ss.spreadsheetId;
  params.action = action;
  params._t = Date.now(); // cache-buster — cegah browser menyajikan respons lama/gagal yang ter-cache

  var qs = Object.keys(params).map(function(k){
    var v = params[k];
    if(v === undefined || v === null) v = '';
    return encodeURIComponent(k)+'='+encodeURIComponent(v);
  }).join('&');

  return fetch(base + '?' + qs, { method:'GET', redirect:'follow', cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).catch(function(err){
    if(err instanceof SyntaxError) throw new Error('Respons server bukan JSON valid — cek deployment Apps Script (harus "Anyone" access & versi terbaru).');
    throw err;
  });
}

function testConnection(spreadsheet){
  var base = spreadsheet.url;
  var qs = 'action=test&spreadsheetId=' + encodeURIComponent(spreadsheet.spreadsheetId);
  return fetch(base + '?' + qs).then(function(r){ return r.json(); });
}

/* =====================================================================
   HELPERS
===================================================================== */
function rupiah(n){ n = Number(n)||0; return 'Rp ' + n.toLocaleString('id-ID'); }
function toast(msg, icon){
  var t = document.getElementById('toast');
  t.innerHTML = (icon?'<span class="msr" style="font-size:18px;">'+icon+'</span>':'') + msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function catColor(name){
  var c = state.kategori.find(function(k){return k.Nama===name;});
  return c ? c.Warna : '#3B7DE8';
}
function catIcon(name){
  var c = state.kategori.find(function(k){return k.Nama===name;});
  return c ? c.Icon : 'sell';
}

function openSheet(title, bodyHtml){
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = bodyHtml;
  document.getElementById('sheetScrim').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetScrim').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
document.getElementById('sheetScrim').onclick = closeSheet;
document.getElementById('sheetClose').onclick = closeSheet;

   DRAWER
===================================================================== */
var drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
document.getElementById('btnMenu').onclick = function(){ drawer.classList.add('open'); scrim.classList.add('open'); };
scrim.onclick = function(){ drawer.classList.remove('open'); scrim.classList.remove('open'); };
document.querySelectorAll('.nav-item').forEach(function(btn){
  btn.onclick = function(){
    setPage(btn.getAttribute('data-page'));
    drawer.classList.remove('open'); scrim.classList.remove('open');
  };
});

/* theme */
function applyTheme(){
  document.body.setAttribute('data-theme', state.theme);
  document.getElementById('themeSwitch').classList.toggle('on', state.theme==='dark');
}
document.getElementById('themeSwitch').onclick = function(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  LS.set('theme', state.theme); applyTheme();
};
applyTheme();

/* =====================================================================
   ROUTER
===================================================================== */
function setPage(p){
  state.page = p;
  document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-page')===p); });
  document.getElementById('fab').classList.toggle('hide', !(p==='produk'||p==='kategori'||p==='member'||p==='voucher'));
  document.getElementById('bottomCart').classList.toggle('hidden', !(p==='transaksi' && state.cart.length));
  var titles = {
    transaksi:['Transaksi Baru','Pilih produk untuk mulai'],
    dashboard:['Dashboard','Ringkasan performa usaha'],
    riwayat:['Riwayat Penjualan','Cari & kelola transaksi'],
    laporan:['Laporan','Analisa performa penjualan'],
    produk:['Produk','Kelola katalog produk'],
    kategori:['Kategori','Kelola kategori produk'],
    member:['Member & Poin','Kelola pelanggan & loyalti'],
    voucher:['Voucher & Promo','Kelola kode diskon'],
    pengaturan:['Pengaturan','Google Spreadsheet & sinkronisasi']
  };
  document.getElementById('appbarTitle').innerHTML = titles[p][0] + '<small id="appbarSub">'+titles[p][1]+'</small>';
  var showTop = (p==='transaksi');
  document.getElementById('btnViewToggle').style.display = showTop ? 'flex':'none';
  document.getElementById('btnSort').style.display = showTop ? 'flex':'none';
  document.getElementById('btnSearch').style.display = showTop ? 'flex':'none';
  document.getElementById('btnCart').style.display = showTop ? 'flex':'none';
  document.getElementById('searchbar').classList.remove('active');
  render();
}

/* =====================================================================
   RENDER DISPATCH
===================================================================== */
function render(){
  if(!activeSpreadsheet()){ renderGate(); return; }
  if(state.multiUserEnabled && !state.currentUser){ renderLogin(); return; }
  if(state.page==='transaksi') renderTransaksi();
  else if(state.page==='dashboard') renderDashboard();
  else if(state.page==='riwayat') renderRiwayat();
  else if(state.page==='laporan') renderLaporan();
  else if(state.page==='produk') renderProdukList();
  else if(state.page==='kategori') renderKategoriList();
  else if(state.page==='member') renderMemberList();
  else if(state.page==='voucher') renderVoucherList();
  else if(state.page==='pengaturan') renderPengaturan();
}

   GATE (belum terhubung)
===================================================================== */
function renderLogin(){
  document.getElementById('bottomCart').classList.add('hidden');
  document.getElementById('fab').classList.add('hide');
  var sp = state.storeProfile;
  var logoHtml = sp.logo ? '<img src="'+sp.logo+'" style="width:100%;height:100%;object-fit:cover;border-radius:20px;">' : '<span class="msr">storefront</span>';
  document.getElementById('page').innerHTML =
    '<div class="login-wrap">'+
      '<div class="logo">'+logoHtml+'</div>'+
      '<h2>Masuk sebagai Kasir</h2>'+
      '<p>Masukkan username & password akun Anda untuk mulai berjualan di '+(sp.nama||'toko ini')+'</p>'+
      '<div class="stack">'+
        '<div class="field"><label>Username</label><input id="loginUser" autocomplete="username"></div>'+
        '<div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div>'+
        '<button class="btn btn-primary btn-block" id="loginBtn">Masuk</button>'+
      '</div>'+
    '</div>';
  function doLogin(){
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPass').value;
    if(!u || !p){ toast('Isi username & password','error'); return; }
    apiCall('login', {username:u, password:p}).then(function(res){
      if(res.error){ toast(res.error,'error'); return; }
      state.currentUser = res.user;
      LS.set('currentUser', res.user);
      state.kasirNama = res.user.Nama;
      LS.set('kasirNama', state.kasirNama);
      toast('Selamat datang, '+res.user.Nama, 'check_circle');
      updateDrawerUser();
      setPage('transaksi');
    }).catch(function(err){ toast('Gagal login: '+err.message, 'error'); });
  }
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('loginPass').onkeydown = function(e){ if(e.key==='Enter') doLogin(); };
}

function updateDrawerBrand(){
  var icon = document.getElementById('drawerLogoIcon');
  var img = document.getElementById('drawerLogoImg');
  var text = document.getElementById('drawerBrandText');
  var sp = state.storeProfile;
  if(sp.logo){
    img.src = sp.logo; img.style.display = 'inline-block'; icon.style.display = 'none';
  } else {
    img.style.display = 'none'; icon.style.display = 'inline';
  }
  text.textContent = sp.nama || 'Kasir Pro';
}

function updateDrawerUser(){
  var wrap = document.getElementById('drawerUserInfo');
  if(state.multiUserEnabled && state.currentUser){
    wrap.style.display='flex';
    document.getElementById('drawerUserName').textContent = state.currentUser.Nama;

  var isAdmin = !state.multiUserEnabled || (state.currentUser && state.currentUser.Role === 'Admin');
  document.querySelectorAll('.nav-item[data-page="produk"], .nav-item[data-page="kategori"], .nav-item[data-page="pengaturan"]').forEach(function(b){
    b.style.display = isAdmin ? 'flex' : 'none';
  });
}

  if(!confirm('Keluar dari sesi kasir ini?')) return;
  state.currentUser = null; LS.set('currentUser', null);
  drawer.classList.remove('open'); scrim.classList.remove('open');
  render();
};

      '<div class="msr">cloud_off</div>'+

        '<button class="btn btn-outline btn-block" id="gateSettings"><span class="msr">settings</span> Pengaturan Spreadsheet</button>'+

function openAddSpreadsheetSheet(existing){
  var html =
    '<div class="field"><label>Nama Spreadsheet</label><input id="fNama" placeholder="Contoh: Cabang Bandung" value="'+(existing?existing.nama:'')+'"></div>'+
    '<div class="field"><label>URL Web App (Apps Script Deploy URL)</label><input id="fWebapp" placeholder="https://script.google.com/macros/s/…/exec" value="'+(existing?existing.url:'')+'"></div>'+
    '<div class="field"><label>URL / ID Spreadsheet</label><input id="fUrl" placeholder="https://docs.google.com/spreadsheets/d/…/edit" value="'+(existing?existing.rawUrl||'':'')+'"></div>'+
    '<div class="field"><label>Spreadsheet ID (otomatis)</label><input id="fId" readonly value="'+(existing?existing.spreadsheetId:'')+'" style="background:var(--ink-100);"></div>'+
    '<div class="stack" style="max-width:none;margin-top:6px;">'+
      '<button class="btn btn-primary btn-block" id="fSave">Simpan</button>'+
      '<button class="btn btn-outline btn-block" id="fTest">Test Connection</button>'+
    '</div>';
  openSheet(existing?'Edit Spreadsheet':'Tambah Spreadsheet', html);

  function extractId(url){
    var m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    return m ? m[1] : url.trim();
  }
  document.getElementById('fUrl').oninput = function(e){ document.getElementById('fId').value = extractId(e.target.value); };
  if(existing) document.getElementById('fId').value = existing.spreadsheetId;

  function isValidWebAppUrl(u){
    return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u.trim());
  }

  document.getElementById('fTest').onclick = function(){
    var urlVal = document.getElementById('fWebapp').value.trim();
    var cand = { url: urlVal, spreadsheetId: document.getElementById('fId').value.trim() };
    if(!cand.url || !cand.spreadsheetId){ toast('Lengkapi URL Web App & Spreadsheet dahulu','error'); return; }
    if(!isValidWebAppUrl(cand.url)){
      toast('URL Web App tidak valid. Harus diawali https://script.google.com/macros/s/ dan diakhiri /exec, tanpa teks lain.', 'error');
      return;
    }
    toast('Menguji koneksi…','sync');
    testConnection(cand).then(function(r){
      toast(r.status==='ok'?'Koneksi berhasil ✔':'Gagal: '+(r.error||'periksa URL'), r.status==='ok'?'check_circle':'error');
    }).catch(function(){ toast('Gagal terhubung ke Web App','error'); });
  };

  document.getElementById('fSave').onclick = function(){
    var nama = document.getElementById('fNama').value.trim();
    var webapp = document.getElementById('fWebapp').value.trim();
    var rawUrl = document.getElementById('fUrl').value.trim();
    var id = document.getElementById('fId').value.trim();
    if(!nama || !webapp || !id){ toast('Lengkapi semua field','error'); return; }
    if(!isValidWebAppUrl(webapp)){
      toast('URL Web App tidak valid. Harus diawali https://script.google.com/macros/s/ dan diakhiri /exec, tanpa teks lain.', 'error');
      return;
    }
    if(existing){
      existing.nama=nama; existing.url=webapp; existing.rawUrl=rawUrl; existing.spreadsheetId=id;
    } else {
      var obj = { id: Date.now(), nama:nama, url:webapp, rawUrl:rawUrl, spreadsheetId:id, active: state.spreadsheets.length===0 };
      state.spreadsheets.push(obj);
    }
    LS.set('spreadsheets', state.spreadsheets);
    closeSheet();
    toast('Spreadsheet disimpan','check_circle');
    if(activeSpreadsheet()) connectAndLoad();
    else renderPengaturan();
  };
}

/* =====================================================================
   CONNECT & LOAD DATA
===================================================================== */
function connectAndLoad(){
  var ss = activeSpreadsheet();
  if(!ss){ render(); return; }
  state.syncing = true; updateSyncBadge();
  apiCall('init', {}, 'POST').then(function(){
    return Promise.all([ apiCall('getProducts'), apiCall('getCategories') ]);
  }).then(function(res){
    state.connected = true; state.syncing = false;
    state.produk = res[0].data || [];
    state.kategori = res[1].data || [];
    if(state.cacheEnabled){ LS.set('produk_cache', state.produk); LS.set('kategori_cache', state.kategori); }
    LS.set('lastSync', new Date().toLocaleString('id-ID'));
    updateSyncBadge();
    flushOfflineQueue();
    render();
    // ambil data terlaris & cek stok menipis (tidak blocking, gagal pun aman)
    apiCall('getDashboard', { threshold: state.lowStockThreshold }).then(function(d){
      state.terlarisNames = (d.produkTerlaris||[]).map(function(p){ return p.nama; });
      var lowCount = (d.produkHampirHabis||[]).length;
      if(lowCount > 0 && lowCount !== state.lastLowStockCount){
        toast(lowCount+' produk stok menipis! Cek Dashboard.', 'warning');
      }
      state.lastLowStockCount = lowCount;
      LS.set('lastLowStockCount', lowCount);
      if(state.page==='transaksi') renderTransaksi();
    }).catch(function(){});
    apiCall('getSettings').then(function(res){
      var s = res.data || {};
      state.loyaltySettings.poinPerRp = Number(s.poinPerRp) || state.loyaltySettings.poinPerRp;
      state.loyaltySettings.nilaiPerPoin = Number(s.nilaiPerPoin) || state.loyaltySettings.nilaiPerPoin;
      LS.set('loyaltySettings', state.loyaltySettings);
    }).catch(function(){});
  }).catch(function(err){
    state.connected = false; state.syncing = false; updateSyncBadge();
    toast('Gagal terhubung: '+err.message, 'error');
    render();
  });
}

function updateSyncBadge(){
  var el = document.getElementById('drawerSync');
  var name = document.getElementById('drawerStoreName');
  var s = activeSpreadsheet();
  name.textContent = s ? s.nama : 'Belum terhubung';
  if(state.syncing){ el.innerHTML = '<span class="dot yellow"></span> Sinkronisasi…'; }
  else if(state.connected){ el.innerHTML = '<span class="dot"></span> Terhubung'; }
  else { el.innerHTML = '<span class="dot red"></span> Tidak Terhubung'; }
}

function setupAutoSync(){
  clearInterval(window.__syncTimer);
  var map = {'10 detik':10000,'1 menit':60000,'5 menit':300000,'10 menit':600000,'30 menit':1800000,'60 menit':3600000};
  var ms = map[LS.get('syncIntervalLbl','5 menit')] || 300000;
  window.__syncTimer = setInterval(function(){ if(activeSpreadsheet() && navigator.onLine) connectAndLoad(); }, ms);
}

/* offline queue */
function flushOfflineQueue(){
  if(!state.offlineQueue.length || !navigator.onLine) return;
  var queue = state.offlineQueue.slice(); state.offlineQueue = []; LS.set('offline_queue', []);
  queue.forEach(function(trx){
    apiCall('createTransaction', trx, 'POST').catch(function(){ state.offlineQueue.push(trx); LS.set('offline_queue', state.offlineQueue); });
  });
}
window.addEventListener('online', flushOfflineQueue);

/* =====================================================================
   TRANSAKSI PAGE
===================================================================== */
function filteredProducts(){
  var list = state.produk.filter(function(p){ return p.Status !== 'Nonaktif'; });
  if(state.categoryFilter === '⭐ Favorit'){
    list = list.filter(function(p){ return state.favorites.indexOf(String(p.ID))>-1; });
  } else if(state.categoryFilter !== 'Semua'){
    list = list.filter(function(p){ return p.Kategori === state.categoryFilter; });
  }
  if(state.searchQuery){
    var q = state.searchQuery.toLowerCase();
    list = list.filter(function(p){ return String(p.Nama).toLowerCase().indexOf(q)>-1 || String(p.Barcode).indexOf(q)>-1 || String(p.SKU).toLowerCase().indexOf(q)>-1; });
  }
  var sorters = {
    'nama-asc': function(a,b){ return String(a.Nama).localeCompare(b.Nama); },
    'nama-desc': function(a,b){ return String(b.Nama).localeCompare(a.Nama); },
    'harga-asc': function(a,b){ return a.Harga-b.Harga; },
    'harga-desc': function(a,b){ return b.Harga-a.Harga; },
    'stok-asc': function(a,b){ return a.Stok-b.Stok; }
  };
  list = list.slice().sort(sorters[state.sortMode]);
  return list;
}

function renderTransaksi(){
  var cats = ['Semua','⭐ Favorit'].concat(state.kategori.slice().sort(function(a,b){return a.Urutan-b.Urutan;}).map(function(c){return c.Nama;}));
  var chips = cats.map(function(c){ return '<button class="chip '+(state.categoryFilter===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>'; }).join('');
  var list = filteredProducts();

  var gridHtml;
  if(!state.produk.length && state.syncing){
    gridHtml = Array(6).fill('<div class="pcard"><div class="img skeleton"></div><div class="body"><div class="skeleton" style="height:12px;border-radius:4px;margin-bottom:6px;"></div><div class="skeleton" style="height:14px;width:60%;border-radius:4px;"></div></div></div>').join('');
  } else if(!list.length){
    gridHtml = '<div class="empty" style="grid-column:1/-1;"><span class="msr">inventory_2</span><div>'+(state.produk.length?'Produk tidak ditemukan':'Belum ada produk. Tambahkan di menu Produk.')+'</div></div>';
  } else {
    gridHtml = list.map(function(p){
      var inCart = state.cart.find(function(c){ return c.id===p.ID; });
      var low = Number(p.Stok) <= state.lowStockThreshold;
      var isFav = state.favorites.indexOf(String(p.ID))>-1;
      var isTerlaris = state.terlarisNames.indexOf(p.Nama)>-1;
      return '<div class="pcard" data-id="'+p.ID+'">'+
        '<button class="favstar '+(isFav?'active':'')+'" data-fav="'+p.ID+'"><span class="msr">star</span></button>'+
        '<div class="img">'+(p.Foto?('<img src="'+p.Foto+'" loading="lazy">'):('<span class="msr">'+catIcon(p.Kategori)+'</span>'))+
          '<span class="badge">'+ (p.Kategori||'') +'</span>'+
          (isTerlaris?'<span class="badge-terlaris"><span class="msr" style="font-size:11px;">local_fire_department</span>Terlaris</span>':'')+
          (low?'<span class="badge-low">Stok '+p.Stok+'</span>':'')+
        '</div>'+
        '<div class="body">'+
          '<div class="name">'+p.Nama+'</div>'+
          '<div class="price tabular">'+rupiah(p.Harga)+'</div>'+
          '<div class="stok">Stok: '+p.Stok+'</div>'+
        '</div>'+
        (inCart ?
          '<div class="qtybox"><button data-act="dec" data-id="'+p.ID+'"><span class="msr">remove</span></button><span class="qn">'+inCart.qty+'</span><button data-act="inc" data-id="'+p.ID+'"><span class="msr">add</span></button></div>'
          : '<button class="addbtn" data-act="add" data-id="'+p.ID+'"><span class="msr">add</span></button>')+
      '</div>';
    }).join('');
  }

  document.getElementById('page').innerHTML =
    '<div class="chips">'+chips+'</div>'+
    '<div class="grid '+(state.viewMode==='list'?'list-view':'')+'">'+gridHtml+'</div>';

  var vtIcon = document.getElementById('btnViewToggleIcon');
  if(vtIcon) vtIcon.textContent = state.viewMode==='list' ? 'grid_view' : 'view_list';

  document.querySelectorAll('.chip').forEach(function(c){ c.onclick=function(){ state.categoryFilter=c.getAttribute('data-cat'); renderTransaksi(); }; });
  document.querySelectorAll('[data-act="add"]').forEach(function(b){ b.onclick=function(){ addToCart(b.getAttribute('data-id')); }; });
  document.querySelectorAll('[data-act="inc"]').forEach(function(b){ b.onclick=function(){ changeQty(b.getAttribute('data-id'), 1); }; });
  document.querySelectorAll('[data-act="dec"]').forEach(function(b){ b.onclick=function(){ changeQty(b.getAttribute('data-id'), -1); }; });
  document.querySelectorAll('[data-fav]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); toggleFavorite(b.getAttribute('data-fav')); }; });

  updateCartUI();
}

function toggleFavorite(id){
  id = String(id);
  var idx = state.favorites.indexOf(id);
  if(idx>-1) state.favorites.splice(idx,1); else state.favorites.push(id);
  LS.set('favorites', state.favorites);
  renderTransaksi();
}

function addToCart(id){
  var p = state.produk.find(function(x){ return String(x.ID)===String(id); });
  if(!p) return;
  if(Number(p.Stok) <= 0){ toast('Stok habis','error'); return; }
  state.cart.push({ id:p.ID, nama:p.Nama, harga:Number(p.Harga), qty:1, foto:p.Foto, stokMax:Number(p.Stok) });
  updateCartUI(); renderTransaksi();
}
function changeQty(id, delta){
  var item = state.cart.find(function(c){ return String(c.id)===String(id); });
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) state.cart = state.cart.filter(function(c){ return c!==item; });
  updateCartUI(); renderTransaksi();
}
function updateCartUI(){
  var count = state.cart.reduce(function(s,c){ return s+c.qty; }, 0);
  var total = state.cart.reduce(function(s,c){ return s+c.qty*c.harga; }, 0);
  var bc = document.getElementById('bottomCart');
  bc.classList.toggle('hidden', !(state.page==='transaksi' && count>0));
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartItemsLbl').textContent = count + ' item';
  document.getElementById('cartTotalLbl').textContent = rupiah(total);
  var abc = document.getElementById('appbarCartCount');
  abc.style.display = count ? 'flex':'none';
  abc.textContent = count;
}

document.getElementById('btnCameraScan').onclick = openBarcodeScanner;
function openBarcodeScanner(){
  if(!('BarcodeDetector' in window)){
    toast('Scan kamera tidak didukung browser ini. Gunakan scanner USB/Bluetooth, atau ketik manual.', 'error');
    return;
  }
  var modal = document.createElement('div');
  modal.className = 'scanner-modal';
  modal.innerHTML =
    '<div class="scan-top"><button id="scanClose"><span class="msr">close</span></button><div style="color:#fff;font-weight:700;">Scan Barcode</div><div style="width:38px;"></div></div>'+
    '<video id="scanVideo" autoplay playsinline muted></video>'+
    '<div class="scan-frame"></div>'+
    '<div class="scan-hint">Arahkan kamera ke barcode produk</div>';
  document.body.appendChild(modal);
  var video = document.getElementById('scanVideo');
  var stream, detector, rafId, stopped=false;

  function closeScanner(){
    stopped = true;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
    modal.remove();
  }
  document.getElementById('scanClose').onclick = closeScanner;

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(s){
    stream = s; video.srcObject = s;
    try{ detector = new BarcodeDetector({ formats: ['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code'] }); }
    catch(e){ detector = new BarcodeDetector(); }
    function loop(){
      if(stopped) return;
      detector.detect(video).then(function(codes){
        if(stopped) return;
        if(codes.length){
          var val = codes[0].rawValue;
          closeScanner();
          state.searchQuery = val;
          searchInput.value = val;
          searchbar.classList.add('active');
          renderTransaksi();
          toast('Barcode terdeteksi: '+val, 'check_circle');
        } else {
          rafId = requestAnimationFrame(loop);
        }
      }).catch(function(){ if(!stopped) rafId = requestAnimationFrame(loop); });
    }
    loop();
  }).catch(function(err){
    toast('Tidak bisa mengakses kamera: '+err.message, 'error');
    closeScanner();
  });
}

function openCartSheet(){
  if(!state.cart.length){ toast('Keranjang masih kosong','info'); return; }
  var lines = state.cart.map(function(c){
    return '<div class="cartline"><div class="thumb">'+(c.foto?'<img src="'+c.foto+'">':'<span class="msr">shopping_bag</span>')+'</div>'+
      '<div class="meta"><div class="n">'+c.nama+'</div><div class="p tabular">'+rupiah(c.harga)+'</div></div>'+
      '<div class="qtystep"><button data-dec="'+c.id+'"><span class="msr" style="font-size:16px;">remove</span></button><span>'+c.qty+'</span><button data-inc="'+c.id+'"><span class="msr" style="font-size:16px;">add</span></button></div></div>';
  }).join('');
  var subtotal = state.cart.reduce(function(s,c){ return s+c.qty*c.harga; }, 0);
  var ck = state.checkout;

  var memberHtml = ck.memberId ?
    ('<div class="listrow" style="align-items:center;"><span style="display:flex;align-items:center;gap:8px;"><span class="msr" style="color:var(--blue-700);">verified</span>'+ck.memberNama+' ('+ck.memberPoin+' poin)</span><button class="iconbtn" id="ckMemberRemove" style="width:28px;height:28px;"><span class="msr" style="font-size:16px;">close</span></button></div>'+
     '<div class="field" style="margin-top:6px;"><label>Tukar Poin (1 poin = '+rupiah(state.loyaltySettings.nilaiPerPoin)+')</label><input id="ckPoin" type="number" min="0" max="'+ck.memberPoin+'" value="'+ck.poinDitukar+'"></div>')
    : '<button class="btn btn-outline btn-block" id="ckMemberPick"><span class="msr">person_search</span> Pilih Member (opsional)</button>';

  var voucherHtml = ck.voucherCode ?
    ('<div class="listrow" style="align-items:center;"><span style="display:flex;align-items:center;gap:8px;"><span class="msr" style="color:var(--green);">confirmation_number</span>'+ck.voucherCode+' (- '+rupiah(ck.voucherDiskon)+')</span><button class="iconbtn" id="ckVoucherRemove" style="width:28px;height:28px;"><span class="msr" style="font-size:16px;">close</span></button></div>')
    : '<div style="display:flex;gap:8px;"><input id="ckVoucherInput" placeholder="Kode voucher…" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;background:var(--surface);"><button class="btn btn-outline btn-sm" id="ckVoucherApply">Pakai</button></div>';

  var html = lines +
    '<div class="field" style="margin-top:14px;margin-bottom:6px;"><label>Member</label></div>'+memberHtml+
    '<div class="field" style="margin-top:14px;margin-bottom:6px;"><label>Kode Voucher</label></div>'+voucherHtml+
    '<div class="field" style="margin-top:14px;"><label>Catatan Pesanan</label><input id="ckNote" placeholder="Opsional…"></div>'+
    '<div class="row2">'+
      '<div class="field"><label>Diskon Tambahan (Rp)</label><input id="ckDiskon" type="number" value="'+ck.diskon+'"></div>'+
      '<div class="field"><label>Pajak PPN (%)</label><input id="ckPajak" type="number" value="'+ck.pajakPersen+'"></div>'+
    '</div>'+
    '<div id="ckSummary"></div>'+
    '<button class="btn btn-danger btn-block" id="ckNext" style="margin-top:6px;">Lanjut ke Pembayaran <span class="msr">arrow_forward</span></button>';
  openSheet('Keranjang ('+state.cart.length+')', html);

  function recalc(){
    var diskonManual = Number(document.getElementById('ckDiskon').value)||0;
    var pajakP = Number(document.getElementById('ckPajak').value)||0;
    var poinInput = document.getElementById('ckPoin');
    var poinDitukar = poinInput ? Math.min(Number(poinInput.value)||0, ck.memberPoin) : 0;
    var diskonPoin = poinDitukar * state.loyaltySettings.nilaiPerPoin;
    var sub = state.cart.reduce(function(s,c){ return s+c.qty*c.harga; }, 0);
    var totalDiskon = diskonManual + ck.voucherDiskon + diskonPoin;
    if(totalDiskon > sub) totalDiskon = sub;
    var pajak = Math.round((sub-totalDiskon) * pajakP/100);
    var total = sub - totalDiskon + pajak;
    ck.diskon = diskonManual; ck.pajakPersen = pajakP; ck.poinDitukar = poinDitukar;
    document.getElementById('ckSummary').innerHTML =
      '<div class="sumrow"><span>Subtotal</span><span class="tabular">'+rupiah(sub)+'</span></div>'+
      (diskonManual?'<div class="sumrow"><span>Diskon</span><span class="tabular">- '+rupiah(diskonManual)+'</span></div>':'')+
      (ck.voucherDiskon?'<div class="sumrow"><span>Voucher ('+ck.voucherCode+')</span><span class="tabular">- '+rupiah(ck.voucherDiskon)+'</span></div>':'')+
      (diskonPoin?'<div class="sumrow"><span>Tukar Poin ('+poinDitukar+')</span><span class="tabular">- '+rupiah(diskonPoin)+'</span></div>':'')+
      '<div class="sumrow"><span>Pajak (PPN '+pajakP+'%)</span><span class="tabular">'+rupiah(pajak)+'</span></div>'+
      '<div class="sumrow total"><span>Total</span><span class="tabular">'+rupiah(total)+'</span></div>';
  }
  recalc();
  document.getElementById('ckDiskon').oninput = recalc;
  document.getElementById('ckPajak').oninput = recalc;
  var ckPoinEl = document.getElementById('ckPoin'); if(ckPoinEl) ckPoinEl.oninput = recalc;

  var memberRemoveBtn = document.getElementById('ckMemberRemove');
  if(memberRemoveBtn) memberRemoveBtn.onclick = function(){ ck.memberId=null; ck.memberNama=''; ck.memberPoin=0; ck.poinDitukar=0; openCartSheet(); };
  var memberPickBtn = document.getElementById('ckMemberPick');
  if(memberPickBtn) memberPickBtn.onclick = openMemberPicker;

  var voucherRemoveBtn = document.getElementById('ckVoucherRemove');
  if(voucherRemoveBtn) voucherRemoveBtn.onclick = function(){ ck.voucherCode=''; ck.voucherDiskon=0; openCartSheet(); };
  var voucherApplyBtn = document.getElementById('ckVoucherApply');
  if(voucherApplyBtn) voucherApplyBtn.onclick = function(){
    var kode = document.getElementById('ckVoucherInput').value.trim();
    if(!kode){ toast('Masukkan kode voucher','error'); return; }
    apiCall('validateVoucher', { kode: kode, subtotal: subtotal }).then(function(res){
      if(res.error){ toast(res.error,'error'); return; }
      ck.voucherCode = kode.toUpperCase(); ck.voucherDiskon = res.diskon;
      toast('Voucher berhasil dipakai','check_circle');
      openCartSheet();
    });
  };

  document.querySelectorAll('[data-inc]').forEach(function(b){ b.onclick=function(){ changeQty(b.getAttribute('data-inc'),1); openCartSheet(); }; });
  document.querySelectorAll('[data-dec]').forEach(function(b){ b.onclick=function(){ changeQty(b.getAttribute('data-dec'),-1); if(state.cart.length) openCartSheet(); else closeSheet(); }; });
  document.getElementById('ckNext').onclick = openPaymentSheet;
}

function openPaymentSheet(){
  var sub = state.cart.reduce(function(s,c){ return s+c.qty*c.harga; }, 0);
  var ck = state.checkout;
  var diskonPoin = ck.poinDitukar * state.loyaltySettings.nilaiPerPoin;
  var totalDiskon = ck.diskon + ck.voucherDiskon + diskonPoin;
  if(totalDiskon > sub) totalDiskon = sub;
  var pajak = Math.round((sub-totalDiskon) * ck.pajakPersen/100);
  var total = sub - totalDiskon + pajak;

  var methods = [['Tunai','payments'],['QRIS','qr_code_2'],['Transfer','account_balance'],['Debit','credit_card'],['Kredit','credit_score'],['E-Wallet','wallet']];
  var pmHtml = methods.map(function(m){ return '<div class="pmethod '+(state.checkout.metode===m[0]?'active':'')+'" data-m="'+m[0]+'"><span class="msr">'+m[1]+'</span>'+m[0]+'</div>'; }).join('');

  var html =
    '<div class="sumrow total" style="border:none;padding-top:0;"><span>Total Tagihan</span><span class="tabular">'+rupiah(total)+'</span></div>'+
    '<div style="height:10px;"></div>'+
    '<div class="paymethods">'+pmHtml+'</div>'+
    '<div class="field"><label>Uang Dibayar</label><input id="ckBayar" type="number" placeholder="0" value="'+(state.checkout.uangDibayar||'')+'"></div>'+
    '<div class="sumrow"><span>Kembalian</span><span class="tabular" id="ckKembali">Rp 0</span></div>'+
    '<button class="btn btn-danger btn-block" id="ckBayarBtn" style="margin-top:8px;">Bayar & Selesaikan <span class="msr">check_circle</span></button>';
  openSheet('Pembayaran', html);

  document.querySelectorAll('.pmethod').forEach(function(el){ el.onclick=function(){ state.checkout.metode = el.getAttribute('data-m'); document.querySelectorAll('.pmethod').forEach(function(x){x.classList.remove('active');}); el.classList.add('active'); }; });
  var bayarInput = document.getElementById('ckBayar');
  function recalcBayar(){
    var bayar = Number(bayarInput.value)||0;
    state.checkout.uangDibayar = bayar;
    document.getElementById('ckKembali').textContent = rupiah(Math.max(bayar-total,0));
  }
  bayarInput.oninput = recalcBayar; recalcBayar();

  document.getElementById('ckBayarBtn').onclick = function(){
    var bayar = Number(bayarInput.value)||0;
    if(state.checkout.metode==='Tunai' && bayar < total){ toast('Uang dibayar kurang dari total','error'); return; }
    finalizeTransaction(sub, totalDiskon, pajak, total, bayar || total);
  };
}

function finalizeTransaction(sub, diskon, pajak, total, bayar){
  var ck = state.checkout;
  var payload = {
    items: JSON.stringify(state.cart.map(function(c){ return {id:c.id, nama:c.nama, qty:c.qty, harga:c.harga}; })),
    subtotal: sub, diskon: diskon, pajak: pajak, total: total,
    uangDibayar: bayar, metode: ck.metode, kasir: state.kasirNama,
    memberId: ck.memberId || '', poinDitukar: ck.poinDitukar || 0, kodeVoucher: ck.voucherCode || ''
  };
  var cartSnapshot = state.cart.slice();
  var kembalian = bayar-total;

  function afterSuccess(invoice, poinDiperoleh){
    state.cart.forEach(function(c){
      var p = state.produk.find(function(x){return String(x.ID)===String(c.id);});
      if(p) p.Stok = Number(p.Stok) - c.qty;
    });
    state.cart = [];
    var memberInfo = ck.memberId ? { nama: ck.memberNama, poinDiperoleh: poinDiperoleh||0, poinSekarang: (ck.memberPoin - ck.poinDitukar + (poinDiperoleh||0)) } : null;
    var metodeUsed = ck.metode;
    state.checkout = { diskon:0, pajakPersen: state.defaultPajak, metode:'Tunai', uangDibayar:0, memberId:null, memberNama:'', memberPoin:0, poinDitukar:0, voucherCode:'', voucherDiskon:0 };
    closeSheet(); updateCartUI(); renderTransaksi();
    showReceipt(invoice, cartSnapshot, sub, diskon, pajak, total, bayar, kembalian, memberInfo, metodeUsed);
  }

  if(!navigator.onLine){
    state.offlineQueue.push(payload); LS.set('offline_queue', state.offlineQueue);
    toast('Offline — transaksi disimpan & akan dikirim otomatis','cloud_off');
    afterSuccess('OFFLINE-'+Date.now(), 0);
    return;
  }
  apiCall('createTransaction', payload, 'POST').then(function(res){
    if(res.error){ toast('Gagal: '+res.error, 'error'); return; }
    toast('Transaksi berhasil ✔','check_circle');
    afterSuccess(res.invoice, res.poinDiperoleh);
  }).catch(function(){
    state.offlineQueue.push(payload); LS.set('offline_queue', state.offlineQueue);
    toast('Gagal kirim — disimpan ke antrean offline','cloud_off');
    afterSuccess('OFFLINE-'+Date.now(), 0);
  });
}

function printBluetooth(invoice, items, sub, diskon, pajak, total, bayar, kembalian){
  if(!navigator.bluetooth){
    toast('Bluetooth Printing hanya didukung Chrome/Edge di Android. Browser ini tidak mendukungnya.', 'error');
    return;
  }
  toast('Mencari printer Bluetooth…', 'bluetooth_searching');
  var SERVICE = '000018f0-0000-1000-8000-00805f9b34fb';
  var CHAR = '00002af1-0000-1000-8000-00805f9b34fb';
  navigator.bluetooth.requestDevice({
    filters: [{ services: [SERVICE] }],
    optionalServices: [SERVICE]
  }).then(function(device){
    return device.gatt.connect();
  }).then(function(server){
    return server.getPrimaryService(SERVICE);
  }).then(function(service){
    return service.getCharacteristic(CHAR);
  }).then(function(characteristic){
    var sp = state.storeProfile;
    var out = [];
    out.push('\x1B\x40'); // reset
    out.push('\x1B\x61\x01'); // center align
    out.push((sp.nama||'Toko Saya')+'\n');
    if(sp.alamat) out.push(sp.alamat+'\n');
    if(sp.telp) out.push(sp.telp+'\n');
    out.push('--------------------------------\n');
    out.push('\x1B\x61\x00'); // left align
    out.push(invoice+'\n--------------------------------\n');
    items.forEach(function(c){ out.push(c.nama+' x'+c.qty+'\n'+'   '+rupiah(c.qty*c.harga)+'\n'); });
    out.push('--------------------------------\n');
    out.push('Subtotal : '+rupiah(sub)+'\n');
    out.push('Diskon   : '+rupiah(diskon)+'\n');
    out.push('Pajak    : '+rupiah(pajak)+'\n');
    out.push('TOTAL    : '+rupiah(total)+'\n');
    out.push('Bayar    : '+rupiah(bayar)+'\n');
    out.push('Kembali  : '+rupiah(Math.max(kembalian,0))+'\n\n');
    if(state.receiptSettings.footer) out.push(state.receiptSettings.footer+'\n');
    out.push('\n\n\n\x1D\x56\x00'); // feed + cut (jika printer mendukung)

    var bytes = new TextEncoder().encode(out.join(''));
    var chunkSize = 180, i = 0;
    function sendChunk(){
      if(i >= bytes.length){ toast('Struk terkirim ke printer ✔','check_circle'); return; }
      var chunk = bytes.slice(i, i+chunkSize);
      characteristic.writeValue(chunk).then(function(){ i += chunkSize; setTimeout(sendChunk, 60); })
        .catch(function(err){ toast('Gagal kirim ke printer: '+err.message, 'error'); });
    }
    sendChunk();
  }).catch(function(err){
    toast('Gagal terhubung ke printer: '+err.message+' — coba printer lain atau gunakan Cetak/PDF.', 'error');
  });
}

  var html =
    storeHeader +
    '<div style="text-align:center;margin-bottom:10px;"><span class="msr" style="font-size:44px;color:var(--green);">check_circle</span>'+
    '<div style="font-weight:800;font-size:16px;margin-top:4px;">Pembayaran Berhasil</div>'+
    '<div style="font-size:12px;color:var(--ink-500);">'+invoice+'</div></div>'+
    memberHtml +
    lines +
    '<div class="sumrow"><span>Subtotal</span><span class="tabular">'+rupiah(sub)+'</span></div>'+
    '<div class="sumrow"><span>Diskon</span><span class="tabular">- '+rupiah(diskon)+'</span></div>'+
    '<div class="sumrow"><span>Pajak</span><span class="tabular">'+rupiah(pajak)+'</span></div>'+
    '<div class="sumrow total"><span>Total</span><span class="tabular">'+rupiah(total)+'</span></div>'+
    '<div class="sumrow"><span>Dibayar ('+metode+')</span><span class="tabular">'+rupiah(bayar)+'</span></div>'+
    '<div class="sumrow"><span>Kembalian</span><span class="tabular">'+rupiah(Math.max(kembalian,0))+'</span></div>'+
    (state.receiptSettings.footer ? '<div style="text-align:center;font-size:11.5px;color:var(--ink-500);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);">'+state.receiptSettings.footer+'</div>' : '')+
    '<div class="stack" style="max-width:none;margin-top:12px;">'+
      '<button class="btn btn-outline btn-block" id="btnPrint"><span class="msr">print</span> Cetak / Simpan PDF</button>'+
      '<button class="btn btn-outline btn-block" id="btnBtPrint"><span class="msr">bluetooth</span> Cetak Bluetooth (Thermal)</button>'+
      '<div style="font-size:10.5px;color:var(--ink-500);text-align:center;">Kompatibilitas tergantung merek printer • hanya Chrome/Edge Android</div>'+
      '<button class="btn btn-outline btn-block" id="btnWa"><span class="msr">share</span> Bagikan via WhatsApp</button>'+
      '<button class="btn btn-primary btn-block" id="btnCloseReceipt">Selesai</button>'+
    '</div>';
  openSheet('Struk Transaksi', html);
  document.getElementById('btnCloseReceipt').onclick = closeSheet;
  document.getElementById('btnPrint').onclick = function(){ window.print(); };
  document.getElementById('btnBtPrint').onclick = function(){ printBluetooth(invoice, items, sub, diskon, pajak, total, bayar, kembalian); };
  document.getElementById('btnWa').onclick = function(){
    var text = 'Struk '+invoice+'\\n' + items.map(function(c){return c.nama+' x'+c.qty+' = '+rupiah(c.qty*c.harga);}).join('\\n') + '\\nTotal: '+rupiah(total);
    window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank');
  };
}

function renderDashboard(){

function renderRiwayat(){
  document.getElementById('page').innerHTML =
    '<div style="padding:12px 14px 0;"><div class="field" style="margin-bottom:8px;"><input id="riwayatSearch" placeholder="Cari nomor invoice…"></div></div>'+
    '<div class="subtabs"><button class="subtab active" data-p="harian">Harian</button><button class="subtab" data-p="mingguan">Mingguan</button><button class="subtab" data-p="bulanan">Bulanan</button><button class="subtab" data-p="tahunan">Tahunan</button></div>'+
    '<div id="riwayatList"><div class="empty"><span class="msr">hourglass_top</span><div>Memuat riwayat…</div></div></div>';

  function load(period){
    var now = new Date(), from;
    if(period==='harian'){ from = fmtDate(now); }
    else if(period==='mingguan'){ var d=new Date(now); d.setDate(d.getDate()-7); from=fmtDate(d); }
    else if(period==='bulanan'){ var d2=new Date(now); d2.setMonth(d2.getMonth()-1); from=fmtDate(d2); }
    else { var d3=new Date(now); d3.setFullYear(d3.getFullYear()-1); from=fmtDate(d3); }
    apiCall('getTransactions', { from: from }).then(function(res){
      var list = res.data || [];
      var html = list.length ? list.map(function(t){
        return '<div class="listcard" data-inv="'+t.Invoice+'">'+
          '<div class="thumb"><span class="msr">receipt</span></div>'+
          '<div class="info"><div class="t1">'+t.Invoice+'</div><div class="t2">'+t.Tanggal+' • '+t.Jam+' • '+t.MetodeBayar+' • '+(t.Status||'')+'</div></div>'+
          '<div style="text-align:right;"><div style="font-weight:800;" class="tabular">'+rupiah(t.Total)+'</div></div>'+
        '</div>';
      }).join('') : '<div class="empty"><span class="msr">receipt_long</span><div>Belum ada transaksi periode ini</div></div>';
      document.getElementById('riwayatList').innerHTML = html;
      document.querySelectorAll('[data-inv]').forEach(function(c){ c.onclick=function(){ openTrxDetail(c.getAttribute('data-inv')); }; });
    }).catch(function(err){ document.getElementById('riwayatList').innerHTML = '<div class="empty"><span class="msr">error</span><div>'+err.message+'</div></div>'; });
  }
  load('harian');
  document.querySelectorAll('.subtab').forEach(function(t){ t.onclick=function(){ document.querySelectorAll('.subtab').forEach(function(x){x.classList.remove('active');}); t.classList.add('active'); load(t.getAttribute('data-p')); }; });
  document.getElementById('riwayatSearch').oninput = function(e){
    apiCall('getTransactions', { query: e.target.value }).then(function(res){
      var list = res.data || [];
      document.getElementById('riwayatList').innerHTML = list.length ? list.map(function(t){
        return '<div class="listcard" data-inv="'+t.Invoice+'"><div class="thumb"><span class="msr">receipt</span></div>'+
          '<div class="info"><div class="t1">'+t.Invoice+'</div><div class="t2">'+t.Tanggal+' • '+t.Jam+'</div></div>'+
          '<div style="font-weight:800;" class="tabular">'+rupiah(t.Total)+'</div></div>';
      }).join('') : '<div class="empty"><span class="msr">search_off</span><div>Tidak ditemukan</div></div>';
    });
  };
}
function fmtDate(d){
  // PENTING: pakai komponen tanggal LOKAL perangkat, bukan toISOString() yang
  // berbasis UTC — karena UTC bisa beda hari dengan WIB (misal dini hari),
  // yang menyebabkan filter tanggal "Hari Ini" tidak menemukan transaksi.
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function openTrxDetail(invoice){

        '<button class="btn btn-danger btn-block" id="btnRefund"><span class="msr">undo</span> Refund</button>'+
      '</div>';
    document.getElementById('sheetBody').innerHTML = html;
    document.getElementById('sheetTitle').textContent = invoice;
    document.getElementById('btnPrintUlang').onclick = function(){ window.print(); };
    document.getElementById('btnVoid').onclick = function(){ apiCall('voidTransaction',{invoice:invoice},'POST').then(function(){ toast('Transaksi di-void','check_circle'); closeSheet(); renderRiwayat(); }); };
    document.getElementById('btnRefund').onclick = function(){ apiCall('refundTransaction',{invoice:invoice},'POST').then(function(){ toast('Refund diproses','check_circle'); closeSheet(); renderRiwayat(); }); };
  });
}

function exportTransaksiCsv(rows){
  var headers = ['Invoice','Tanggal','Jam','Kasir','Subtotal','Diskon','Pajak','Total','MetodeBayar','Status'];

}
function exportProdukCsv(){
  var headers = ['ID','Nama','Kategori','Harga','Modal','Stok','Barcode','SKU'];
  var csv = [headers.join(',')].concat(state.produk.map(function(r){ return headers.map(function(h){ return r[h]; }).join(','); })).join('\\n');
  downloadFile('produk.csv', csv, 'text/csv');
}
function downloadFile(name, content, type){
  var blob = new Blob([content], {type:type});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

  openSheet(m?'Edit Member':'Tambah Member', html);
  document.getElementById('mfSave').onclick = function(){
    var payload = { id:m?m.ID:undefined, nama:document.getElementById('mfNama').value.trim(), noHp:document.getElementById('mfHp').value.trim(), alamat:document.getElementById('mfAlamat').value.trim() };
    if(!payload.nama){ toast('Nama member wajib diisi','error'); return; }
    apiCall(m?'updateMember':'addMember', payload, 'POST').then(function(res){
      if(res.error){ toast(res.error,'error'); return; }
      toast('Member tersimpan','check_circle'); closeSheet(); renderMemberList();
    });
  };
}

/* =====================================================================
   VOUCHER & PROMO
===================================================================== */
function renderVoucherList(){
  document.getElementById('page').innerHTML = '<div style="padding-top:10px;" id="voucherListWrap"><div class="empty"><span class="msr">hourglass_top</span><div>Memuat voucher…</div></div></div>';
  apiCall('getVouchers').then(function(res){
    var list = res.data || [];
    document.getElementById('voucherListWrap').innerHTML = list.length ? list.map(function(v){
      var nilaiTxt = v.Tipe==='Persen' ? v.Nilai+'%' : rupiah(v.Nilai);
      return '<div class="listcard" data-id="'+v.ID+'">'+
        '<div class="dotcat" style="background:'+(v.Aktif==='Ya'?'var(--green)':'var(--ink-300)')+';"><span class="msr">confirmation_number</span></div>'+
        '<div class="info"><div class="t1">'+v.Kode+' <span style="font-weight:400;color:var(--ink-500);font-size:11.5px;">('+(v.Aktif==='Ya'?'Aktif':'Nonaktif')+')</span></div><div class="t2">Diskon '+nilaiTxt+' • Min. belanja '+rupiah(v.MinBelanja)+' • Terpakai '+v.Terpakai+(Number(v.Kuota)>0?'/'+v.Kuota:'')+'</div></div>'+
        '<div class="actions"><button class="iconbtn" data-edit="'+v.ID+'"><span class="msr" style="font-size:19px;">edit</span></button><button class="iconbtn" data-del="'+v.ID+'"><span class="msr" style="font-size:19px;color:var(--red-600);">delete</span></button></div>'+
      '</div>';
    }).join('') : '<div class="empty"><span class="msr">confirmation_number</span><div>Belum ada voucher</div></div>';
    document.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ openVoucherForm(list.find(function(v){return String(v.ID)===b.getAttribute('data-edit');})); }; });
    document.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ if(confirm('Hapus voucher ini?')) apiCall('deleteVoucher',{id:b.getAttribute('data-del')},'POST').then(function(){ toast('Voucher dihapus','check_circle'); renderVoucherList(); }); }; });
  });
}

function openVoucherForm(v){
  var html =
    '<div class="field"><label>Kode Voucher</label><input id="vfKode" value="'+(v?v.Kode:'')+'" style="text-transform:uppercase;"></div>'+
    '<div class="row2">'+
      '<div class="field"><label>Tipe Diskon</label><select id="vfTipe"><option value="Nominal" '+(v&&v.Tipe==='Nominal'?'selected':'')+'>Nominal (Rp)</option><option value="Persen" '+(v&&v.Tipe==='Persen'?'selected':'')+'>Persen (%)</option></select></div>'+
      '<div class="field"><label>Nilai</label><input id="vfNilai" type="number" value="'+(v?v.Nilai:'')+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div class="field"><label>Minimal Belanja (Rp)</label><input id="vfMin" type="number" value="'+(v?v.MinBelanja:0)+'"></div>'+
      '<div class="field"><label>Kuota (0=tanpa batas)</label><input id="vfKuota" type="number" value="'+(v?v.Kuota:0)+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div class="field"><label>Kadaluarsa (opsional)</label><input id="vfExp" type="date" value="'+(v?v.Kadaluarsa:'')+'"></div>'+
      '<div class="field"><label>Status</label><select id="vfAktif"><option value="Ya" '+(!v||v.Aktif==='Ya'?'selected':'')+'>Aktif</option><option value="Tidak" '+(v&&v.Aktif==='Tidak'?'selected':'')+'>Nonaktif</option></select></div>'+
    '</div>'+
    '<button class="btn btn-primary btn-block" id="vfSave">'+(v?'Simpan':'Tambah Voucher')+'</button>';
  openSheet(v?'Edit Voucher':'Tambah Voucher', html);
  document.getElementById('vfSave').onclick = function(){
    var payload = { id:v?v.ID:undefined, kode:document.getElementById('vfKode').value.trim(), tipe:document.getElementById('vfTipe').value,
      nilai:document.getElementById('vfNilai').value, minBelanja:document.getElementById('vfMin').value, kuota:document.getElementById('vfKuota').value,
      kadaluarsa:document.getElementById('vfExp').value, aktif:document.getElementById('vfAktif').value };
    if(!payload.kode || !payload.nilai){ toast('Kode & Nilai wajib diisi','error'); return; }
    apiCall(v?'updateVoucher':'addVoucher', payload, 'POST').then(function(res){
      if(res.error){ toast(res.error,'error'); return; }
      toast('Voucher tersimpan','check_circle'); closeSheet(); renderVoucherList();
    });
  };
}

/* fab */
document.getElementById('fab').onclick = function(){
  if(state.page==='produk') openProdukForm(null);
  else if(state.page==='kategori') openKategoriForm(null);
  else if(state.page==='member') openMemberForm(null);
  else if(state.page==='voucher') openVoucherForm(null);
};

/* =====================================================================
   INIT
===================================================================== */
function boot(){
  updateSyncBadge();
  updateDrawerUser();
  updateDrawerBrand();
  if(activeSpreadsheet()){ connectAndLoad(); } 
  setPage(state.page);
  setupAutoSync();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
}
boot();
</script>
